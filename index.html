<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Knowledge Notes technical briefing">
  <title>Agent Engineering, Made Visible</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>
  <aside id="side-menu" aria-label="Deck contents"><header><span>Contents</span><button id="close-menu" class="icon-button" aria-label="Close contents">x</button></header><div id="menu-list"></div></aside>
  <button id="menu-overlay" aria-label="Close contents"></button>
  <main id="deck-viewport" aria-live="polite"></main>
  <nav class="navigation" aria-label="Page navigation"><button id="previous-page" class="nav-button" aria-label="Previous page">←</button><span id="page-indicator"></span><button id="next-page" class="nav-button" aria-label="Next page">→</button></nav>
  <div class="toolbelt" aria-label="Deck tools"><button id="toggle-menu" class="icon-button" aria-label="Open contents">☰</button><button id="toggle-pen" class="icon-button" aria-label="Toggle pen trail">✦</button><button id="toggle-draw" class="icon-button" aria-label="Toggle drawing board">✎</button><label class="color-control" aria-label="Drawing color"><input id="draw-color" type="color" value="#f05d5e"></label><button id="toggle-fullscreen" class="icon-button" aria-label="Toggle fullscreen">⛶</button></div>
  <canvas id="pen-canvas" aria-hidden="true"></canvas><canvas id="draw-canvas" aria-label="Drawing board"></canvas>
  <p id="draw-hint" role="status">Draw mode: press D or Escape to clear and exit.</p>
  <script type="module" src="js/player.js"></script>
</body>
</html>
